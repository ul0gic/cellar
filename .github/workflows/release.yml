name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - id: version
        name: Check the tag matches the version
        run: |
          version="$(node -p "require('./backend/package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match backend/package.json version ${version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - run: pnpm install --frozen-lockfile
      - name: Check
        run: |
          pnpm typecheck
          pnpm lint
          pnpm openapi
          pnpm exec validate-api contract/dist/openapi.json
      - name: Publish the catalog release if the dataset is new
        run: |
          catalog="$(node -p "require('./catalog/dataset/version.json').version")"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/catalog"
          node catalog/bin/cellar-catalog.ts build --out catalog/out
          mkdir -p catalog/published
          if gh release view catalog > /dev/null 2>&1; then
            gh release download catalog --pattern catalog-index.json --dir catalog/published
            if node -e "process.exit(require('./catalog/published/catalog-index.json').releases.some((r) => r.version === process.argv[1]) ? 0 : 1)" "${catalog}"; then
              echo "Catalog ${catalog} is already published."
              exit 0
            fi
            previous="$(node -p "require('./catalog/published/catalog-index.json').latest")"
            gh release download catalog --pattern "cellar-catalog-${previous}.zip" --dir catalog/published
            unzip -qn "catalog/published/cellar-catalog-${previous}.zip" -d catalog/out
            node catalog/bin/cellar-catalog.ts pack "catalog/out/cellar-catalog-${catalog}" \
              --previous "catalog/out/cellar-catalog-${previous}" \
              --index catalog/published/catalog-index.json \
              --base-url "${base}"
          else
            gh release create catalog --title "Recipe catalog" --latest=false \
              --notes "Recipe catalog releases that running installs download when the owner checks for updates. Every version stays here because the index lists them all."
            node catalog/bin/cellar-catalog.ts pack "catalog/out/cellar-catalog-${catalog}" --first --base-url "${base}"
          fi
          gh release upload catalog "catalog/out/cellar-catalog-${catalog}.zip"
          gh release upload catalog catalog/out/catalog-index.json --clobber

  image:
    needs: prepare
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: CELLAR_VERSION=${{ needs.prepare.outputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Save the digest
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${RUNNER_TEMP}/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1

  manifest:
    needs: [ prepare, image ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - name: Tag the multi-architecture image
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "${DOCKER_METADATA_OUTPUT_JSON}") \
            $(printf "${IMAGE}@sha256:%s " *)
      - name: Check the published image
        run: |
          docker buildx imagetools inspect "${IMAGE}:${{ needs.prepare.outputs.version }}"
          docker run --rm "${IMAGE}:${{ needs.prepare.outputs.version }}" version

  release:
    needs: [ prepare, manifest ]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm openapi
      - name: Create the GitHub release
        run: |
          gh release create "${GITHUB_REF_NAME}" compose.yaml contract/dist/openapi.json \
            --title "Cellar ${{ needs.prepare.outputs.version }}" --generate-notes --latest
