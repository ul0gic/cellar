name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  prepare:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.22.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - id: version
        name: Check the tag matches the version
        run: |
          version="$(node -p "require('./backend/package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match backend/package.json version ${version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - run: pnpm install --frozen-lockfile
      - name: Check
        run: |
          pnpm typecheck
          pnpm lint
          pnpm openapi
          pnpm exec validate-api contract/dist/openapi.json
      - name: Publish the catalog release if the dataset is new
        run: |
          catalog="$(node -p "require('./catalog/dataset/version.json').version")"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/catalog"
          node catalog/bin/cellar-catalog.ts build --out catalog/out
          mkdir -p catalog/published
          if gh release view catalog > /dev/null 2>&1; then
            gh release download catalog --pattern catalog-index.json --dir catalog/published
            if node -e "process.exit(require('./catalog/published/catalog-index.json').releases.some((r) => r.version === process.argv[1]) ? 0 : 1)" "${catalog}"; then
              echo "Catalog ${catalog} is already published."
              exit 0
            fi
            previous="$(node -p "require('./catalog/published/catalog-index.json').latest")"
            gh release download catalog --pattern "cellar-catalog-${previous}.zip" --dir catalog/published
            unzip -qn "catalog/published/cellar-catalog-${previous}.zip" -d catalog/out
            node catalog/bin/cellar-catalog.ts pack "catalog/out/cellar-catalog-${catalog}" \
              --previous "catalog/out/cellar-catalog-${previous}" \
              --index catalog/published/catalog-index.json \
              --base-url "${base}"
          else
            gh release create catalog --title "Recipe catalog" --latest=false \
              --notes "Recipe catalog releases that running installs download when the owner checks for updates. Every version stays here because the index lists them all."
            node catalog/bin/cellar-catalog.ts pack "catalog/out/cellar-catalog-${catalog}" --first --base-url "${base}"
          fi
          gh release upload catalog "catalog/out/cellar-catalog-${catalog}.zip"
          gh release upload catalog catalog/out/catalog-index.json --clobber

  image:
    needs: prepare
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-26.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: CELLAR_VERSION=${{ needs.prepare.outputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Save the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1

  manifest:
    needs: [ prepare, image ]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - name: Tag the multi-architecture image
        working-directory: ${{ runner.temp }}/digests
        env:
          META_JSON: ${{ steps.meta.outputs.json }}
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "${META_JSON}") \
            $(printf "${IMAGE}@sha256:%s " *)
      - name: Check the published image
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          docker buildx imagetools inspect "${IMAGE}:${VERSION}"
          docker run --rm "${IMAGE}:${VERSION}" version

  release:
    needs: [ prepare, manifest ]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.22.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm openapi
      - name: Create the GitHub release
        run: |
          gh release create "${GITHUB_REF_NAME}" compose.yaml contract/dist/openapi.json \
            --title "Cellar ${VERSION}" --generate-notes --latest
